- carlsbad structure
keywords:
- minority attack
- Carlsbad
- b4-b5
- queenside pawn storm
- exchange variation
rules_of_thumb:
- Side with fewer queenside pawns advances b-pawn to create a backward c-pawn or open file.
- 'Classic in QGD Exchange / Carlsbad: White plays b4–b5 vs Black''s c6–d5.'
- Defender meets b5 carefully; piece play on kingside is the usual counter.
plans:
- 'Attacker: b4, a3, Rb1, b5, fix or open the c-file.'
- 'Defender: ...b5 clamp, or kingside counterplay before the structure cracks.'
