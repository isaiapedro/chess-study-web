rules_of_thumb:
- Black sits behind the 6th-rank pawns and waits for ...b5/...d5 breaks.
- White must not overextend; watch tactical shots on the long diagonals.
plans:
- Black — patience, then explosive ...b5 or ...d5.
- White — restrain breaks, probe weaknesses, avoid loose pieces.
