rules_of_thumb:
- Black fianchetto and often strikes with ...e5 or ...c5; kingside attacks are thematic after a closed
  centre.
- White chooses Classical, Sämisch, or Fianchetto setups — space vs Black's dynamic breaks.
plans:
- Black — ...f5 attack or queenside counterplay depending on the line.
- White — central bind, queenside expansion, meet ...f5 with piece play.
