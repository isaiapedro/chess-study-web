id: endgame.opposite_bishops
label: Opposite-Bishop Ending
phase: endgame
family: endgame_theory
aliases:
  - opposite bishop ending
keywords:
  - opposite-colored bishops endgame
  - drawish opposite bishops
rules_of_thumb:
  - Same-colored pawn majorities matter less; blockading on the right color is key.
  - Extra pawns often insufficient if all on one wing and blockaded.
plans:
  - Stronger side — create two widely separated passed pawns.
  - Weaker side — blockade on the bishop's color, keep king active.
related:
  - imbalance.opposite_bishops
