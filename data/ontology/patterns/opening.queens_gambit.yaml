rules_of_thumb:
- Fight for d5/c4; Exchange/Carlsbad often leads to minority-attack structures.
- Black chooses solid (...e6) or more active systems (Tarrasch, Semi-Slav ideas).
plans:
- White — pressure d5, minority attack, or central break e4.
- Black — ...c5/...e5 freeing breaks, piece activity.
