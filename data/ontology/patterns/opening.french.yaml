rules_of_thumb:
- Black challenges e4 with ...d5; the light-squared bishop is the problem child.
- Plans revolve around ...c5 breaks and play against a fixed e5 pawn in the Advance.
plans:
- Black — ...c5, pressure d4, free the c8 bishop later.
- White — space on kingside or central bind; meet ...c5 carefully.
